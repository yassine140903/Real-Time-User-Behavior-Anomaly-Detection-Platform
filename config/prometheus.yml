global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "enrichment"
    static_configs:
      - targets: ["enrichment-service:9100"]

  - job_name: "scoring"
    static_configs:
      - targets: ["scoring-service:9101"]

  - job_name: "decision"
    static_configs:
      - targets: ["decision-service:9102"]

  - job_name: "raw-events-sink"
    static_configs:
      - targets: ["raw-events-sink:9103"]

  - job_name: "decisions-sink"
    static_configs:
      - targets: ["decisions-sink:9104"]

  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]

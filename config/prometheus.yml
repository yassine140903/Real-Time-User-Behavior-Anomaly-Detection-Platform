# config/prometheus.yml

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "enrichment"
    static_configs:
      - targets: ["enrichment-service:9100"]

  - job_name: "scoring"
    static_configs:
      - targets: ["scoring-service:9101"]

  - job_name: "decision"
    static_configs:
      - targets: ["decision-service:9102"]

  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]
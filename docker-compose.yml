x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/amen_anomaly
    - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY:-}
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__CORE__DAGS_FOLDER=/app/dags
    - AIRFLOW__WEBSERVER__SECRET_KEY=amen_bank_airflow_secret_key_2025
    - PYTHONPATH=/app
    - REDIS_HOST=redis
    - REDIS_PORT=6379
    - DB_HOST=postgres
    - DB_PORT=5432
    - DB_NAME=amen_anomaly
    - DB_USER=postgres
    - DB_PASSWORD=postgres
    - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
  volumes:
    - .:/app
    - ./dags:/app/dags
    - ./models:/app/models
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "9092:9092"
      - "8082:8082"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/var/lib/redis/data

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=amen_anomaly
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  db-seed:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: db-seed
    command: python -m scripts.load_postgresql
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=amen_anomaly
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    profiles:
      - seed

  hydrate-redis:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: hydrate-redis
    command: python -m src.batch.hydrate_redis --skip-buffers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=amen_anomaly
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./src:/app/src

  simulation-api:
      build:
        context: .
        dockerfile: Dockerfile.api
      container_name: simulation-api
      ports:
        - "8000:8000"
      depends_on:
        hydrate-redis:
          condition: service_completed_successfully
      environment:
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - DB_HOST=postgres
        - DB_PORT=5432
        - DB_NAME=amen_anomaly
        - DB_USER=postgres
        - DB_PASSWORD=postgres
      volumes:
        - ./models:/app/models
        - ./src:/app/src

  enrichment-service:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: enrichment-service
    command: python -m src.streaming.enrichment_service
    ports:
      - "9100:9100"
    depends_on:
      hydrate-redis:
        condition: service_completed_successfully
      redpanda:
        condition: service_started
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP=redpanda:29092
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=amen_anomaly
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./src:/app/src

  scoring-service:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: scoring-service
    command: python -m src.streaming.scoring_service
    ports:
      - "9101:9101"
    depends_on:
      hydrate-redis:
        condition: service_completed_successfully
      redpanda:
        condition: service_started
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP=redpanda:29092
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=amen_anomaly
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    volumes:
      - ./models:/app/models
      - ./src:/app/src

  decision-service:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: decision-service
    command: python -m src.streaming.decision_service
    ports:
      - "9102:9102"
    depends_on:
      hydrate-redis:
        condition: service_completed_successfully
      redpanda:
        condition: service_started
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP=redpanda:29092
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=amen_anomaly
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    volumes:
      - ./models:/app/models
      - ./src:/app/src

  raw-events-sink:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: raw-events-sink
    command: python -m src.streaming.sinks.raw_events_sink
    ports:
      - "9103:9103"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=amen_anomaly
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - KAFKA_BOOTSTRAP=redpanda:29092
    volumes:
      - ./src:/app/src

  decisions-sink:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: decisions-sink
    command: python -m src.streaming.sinks.decisions_sink
    ports:
      - "9104:9104"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
      redis:
        condition: service_started
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=amen_anomaly
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP=redpanda:29092
    volumes:
      - ./src:/app/src

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    command:
      - "--kafka.server=redpanda:29092"
    ports:
      - "9308:9308"
    depends_on:
      - redpanda

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/alert_rules.yml:/etc/prometheus/alert_rules.yml
    depends_on:
      - kafka-exporter
      - enrichment-service
      - scoring-service
      - decision-service
      - raw-events-sink
      - decisions-sink
      - alertmanager

  simulator:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: simulator
    command: python -m src.streaming.simulator
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=amen_anomaly
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - KAFKA_BOOTSTRAP=redpanda:29092
    volumes:
      - ./src:/app/src
    profiles:
      - simulate
  


  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash -c
    command:
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver --port 8080
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - ./dags:/app/dags
      - ./models:/app/models
      - airflow-logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - ./dags:/app/dags
      - ./models:/app/models
      - airflow-logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped


  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri file:///mlflow/mlruns
      --default-artifact-root file:///mlflow/mlruns
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    restart: unless-stopped

  webhook-relay:
    build:
      context: .
      dockerfile: Dockerfile.webhook
    command: uvicorn src.webhook.relay:app --host 0.0.0.0 --port 8000
    environment:
      - AIRFLOW_URL=http://airflow-webserver:8080
      - AIRFLOW_ADMIN_PASSWORD=admin
    depends_on:
      - airflow-webserver
    restart: unless-stopped
  
  
  training:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: amen-anomaly-training:latest
    container_name: training
    command: python -m src.training.train_all
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=amen_anomaly
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
    profiles:
      - training

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: dashboard
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=amen_anomaly
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - API_URL=http://simulation-api:8000/api/v1
      - PROMETHEUS_URL=http://prometheus:9090

volumes:
  redpanda-data:
  redis-data:
  postgres-data:
  airflow-logs: